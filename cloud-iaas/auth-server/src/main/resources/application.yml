spring:
  application:
    name: auth-server # 微服务名称
  config:
    import:
      - "nacos:auth-server-dev.yml?group=B_GROUP"
  cloud:
    nacos:
      server-addr: 192.168.100.128:8848
      username: nacos
      password: nacos
      discovery:  # 配置nacos注册中心
        namespace: 9360894e-f2bc-432e-9e0b-33e3b30460e4
        group: B_GROUP
        service: ${spring.application.name}
      config: # 配置nacos配置中心
        namespace: ${spring.cloud.nacos.discovery.namespace}
        group: ${spring.cloud.nacos.discovery.group}
        prefix: ${spring.application.name}
        file-extension: yml
        shared-configs:   # 配置共享配置文件
          - application-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
  profiles: # 多环境配置
    active: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3307/fly?useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&transformedBitIsBoolean=true&allowMultiQueries=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
#    hikari:
#      minimum-idle: 5
#      maximum-pool-size: 20
#      idle-timeout: 600000
#      max-lifetime: 1800000
#      connection-timeout: 30000
#      connection-test-query: SELECT 1

  data:
   redis:
    host: 192.168.100.128
    port: 6388
    connect-timeout: 10s
    timeout: 15s
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
    format:
      date: yyyy-MM-dd HH:mm:ss
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

server:
  port: 9999


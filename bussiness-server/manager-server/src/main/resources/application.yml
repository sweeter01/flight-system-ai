spring:
  threads:
    virtual:
      enabled: true
  application:
    name: manager-server
  ai:
    dashscope:
      embedding:
        options:
          model: text-embedding-v3
      api-key: ${QWEN_API_KEY}
      chat:
        options:
          model: qwen-plus
    vectorstore:
      redis:
        index-name: power-index
        initialize-schema: true
        prefix: power-prefix
  data:
    redis:
      host: 192.168.100.128
      port: 6388
      connect-timeout: 10s
      timeout: 15s
  cache:
    type: redis
    redis:
      time-to-live: 3600000
      cache-null-values: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3307/fly?useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&transformedBitIsBoolean=true&allowMultiQueries=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1

  config:
    import:
      - "nacos:manager-server-dev.yml?group=B_GROUP"
      - "nacos:application-dev.yml?group=PUBLIC"
  cloud:
    nacos:
      server-addr: 192.168.100.128:8848
      username: nacos
      password: nacos
      discovery:
        namespace: 9360894e-f2bc-432e-9e0b-33e3b30460e4
        group: B_GROUP
        service: ${spring.application.name}
      config:
        namespace: ${spring.cloud.nacos.discovery.namespace}   #必须要有的命名空间
  profiles:
    active: dev

  # 开启允许bean定义覆盖
  main:
    allow-bean-definition-overriding: true